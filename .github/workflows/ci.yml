name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }

      - run: npm ci
      - name: Push schema and seed demo data
        run: npx drizzle-kit push --force && npx tsx scripts/seed.ts
        env: { DATABASE_URL: "postgres://ubuntu:ubuntu@localhost:5432/app", STORE_ID: "1" }

      - name: Type check + production build
        run: npm run build
        env: { DATABASE_URL: "postgres://ubuntu:ubuntu@localhost:5432/app" }

      - name: Backend + query-plan tests
        run: npx vitest run
        env: { DATABASE_URL: "postgres://ubuntu:ubuntu@localhost:5432/app", STORE_ID: "1" }

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        run: npx playwright test
        env: { DATABASE_URL: "postgres://ubuntu:ubuntu@localhost:5432/app", STORE_ID: "1" }

      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
