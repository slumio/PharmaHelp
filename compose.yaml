services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - pharmacy_data:/data
    environment:
      DATABASE_PATH: /data/pharmahelp.sqlite
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      STORE_ID: ${STORE_ID:-1}
      APP_USERNAME: ${APP_USERNAME:?Run python3 manage.py init}
      APP_PASSWORD: ${APP_PASSWORD:?Run python3 manage.py init}
      AUTH_SECRET: ${AUTH_SECRET:?Run python3 manage.py init}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
volumes:
  pharmacy_data:
