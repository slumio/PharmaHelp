services:
  - type: web
    name: pharmahelp
    runtime: docker
    plan: starter
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    disk:
      name: pharmacy-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/pharmahelp.sqlite
      - key: SEED_SAMPLE_DATA
        value: 'true'
      - key: STORE_ID
        value: '1'
      - key: APP_USERNAME
        value: admin
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_PASSWORD
        generateValue: true
