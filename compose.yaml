services:
  mongo:
    image: mongo:8
    command: [mongod, --replSet, rs0, --bind_ip_all]
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) quit(1); } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}); quit(1); }'"]
      interval: 5s
      timeout: 10s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      MONGODB_URI: ${COMPOSE_MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0}
      MONGODB_DB: ${MONGODB_DB:-pharmahelp}
      STORE_ID: ${STORE_ID:-1}
      APP_USERNAME: ${APP_USERNAME:?Run python3 manage.py init}
      APP_PASSWORD: ${APP_PASSWORD:?Run python3 manage.py init}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
