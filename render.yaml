services:
  - type: web
    name: pharmahelp
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: 'true'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pharmahelp
      - key: STORE_ID
        value: '1'
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
